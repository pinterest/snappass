{% extends "base.html" %}

{% block content %}
<section aria-labelledby="page-title">
  <header>
    <h1 id="page-title">{{ _('Secret') }}</h1>
    <p class="alert">{{ _('You can only reveal the secret once! After that, it is permanently deleted.') }}</p>
  </header>
  
  <form id="revealSecretForm" method="post" action="">
    <div class="button-group">
      <button type="submit" id="revealSecret">{{ _('Reveal secret') }}</button>
    </div>
  </form>
</section>
{% endblock %}

{% block js %}
<script>
  // We want to preserve the hash when the form submits. 
  // By default, forms submitting to the same path drop the hash in some browsers, 
  // so we dynamically set the action to include the hash.
  document.getElementById('revealSecretForm').addEventListener('submit', function(e) {
    this.action = window.location.pathname + window.location.hash;
  });
</script>
{% endblock %}
