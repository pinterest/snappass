{% extends "base.html" %}

{% block content %}
<div class="container">
  <section>
    <div class="page-header"><h1>{{ _('Share Secret Link') }}</h1></div>
    <p>{{ _('The secret has been temporarily saved. Send the following URL to your intended recipient.') }}</p>
    <div class="row">
      <div class="col-sm-6 margin-bottom-10">
        <input type="text" class="form-control" id="password-link" value="{{ password_link }}" readonly="readonly">
      </div>

      <div class="col-sm-6">
        <button type="button" id="copy-clipboard-btn" class="btn btn-primary" title="{{ _('Copy to clipboard') }}" aria-label="{{ _('Copy to clipboard') }}" data-text-copied="{{ _('Copied!') }}" data-error-copy="{{ _('Failed to copy to clipboard.') }}">
          {{ _('Copy') }}
        </button>
      </div>
    </div>
  </section>
</div>
{% endblock %}

{% block js %}
<script type="module">
  import { setupClipboard, $ } from '{{ config.STATIC_URL }}/snappass/scripts/utils.js';
  document.addEventListener('DOMContentLoaded', () => {
    setupClipboard('#copy-clipboard-btn', () => $('#password-link').value);
  });
</script>
{% endblock %}
