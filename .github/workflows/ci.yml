name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-python-${{ matrix.python-version }}-pip-${{ hashFiles('.github/workflows/ci.yml') }}
        restore-keys: ${{ runner.os }}-python-${{ matrix.python-version }}-pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-gh-actions
    - name: Lint
      if: matrix.python-version == '3.10'
      run: tox -e flake8
    - name: Tests
      run: tox

  redis-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        redis-version: ['6.0', '7.4']
    services:
      redis:
        image: redis:${{ matrix.redis-version }}
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: python -m pip install -r requirements.txt -r dev-requirements.txt
    - name: Test retrieval against Redis
      env:
        REDIS_HOST: localhost
        REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
      run: >-
        python -m pytest -q
        tests.py::SnapPassTestCase
        tests.py::SnapPassRoutesTestCase::test_show_password
        tests.py::SnapPassRoutesTestCase::test_retrieve_password_api_v2
